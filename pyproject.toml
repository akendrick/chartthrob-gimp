[project]
name = "chartthrob-gimp"
version = "0.1.0"
description = "GIMP port of ChartThrob (originally by Kevin Bjorke) -- a digital-negative calibration chart tool"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["chartthrob"]
