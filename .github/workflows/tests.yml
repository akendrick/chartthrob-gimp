name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    # The image operations need GIMP and are checked with
    # scripts/run_integration.sh on a machine that has it; the maths runs here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests --ignore=tests/integration
